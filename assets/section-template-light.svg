<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112"
     width="1200" height="112" role="img" aria-label="Project 1 - dbt Template for BigQuery Cost Observability">
  <style>
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="112" rx="12" fill="#F6F8FA"/>
  <rect width="1200" height="112" rx="12" fill="url(#w)"/>
  <rect width="6" height="112" rx="3" fill="#2563EB"/>
  <g class="rise">
  <text x="40" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22"
        fill="#656D76">A dbt project with contracts, incremental merges, a snapshot and a custom materialization - built small</text>
  <text x="40" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22"
        fill="#656D76">enough to run on seeds, so the companion Power BI report has something real to observe.</text>
  </g>
</svg>
