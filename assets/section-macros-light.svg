<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 144"
     width="1200" height="144" role="img" aria-label="Project 2 - dbt Custom Macros for BigQuery">
  <style>
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="144" rx="12" fill="#F6F8FA"/>
  <rect width="1200" height="144" rx="12" fill="url(#w)"/>
  <rect width="6" height="144" rx="3" fill="#7C3AED"/>
  <g class="rise">
  <text x="40" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22"
        fill="#656D76">A MERGE that skips rows where nothing actually changed, and native COLLATE on a column so</text>
  <text x="40" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22"
        fill="#656D76">case-insensitive filters stop wrapping every row in UPPER(). Opt in per model, nothing changes for</text>
  <text x="40" y="110" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22"
        fill="#656D76">models that do not.</text>
  </g>
</svg>
