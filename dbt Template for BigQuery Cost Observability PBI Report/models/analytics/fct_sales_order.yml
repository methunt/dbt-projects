version: 2

models:
  - name: fct_sales_order
    description: '{{ doc("table_fct_sales_order") }}'
    columns:
      - name: OrderKey
        data_type: int64
        description: '{{ doc("order_key") }}'
        constraints:
          - type: not_null
        data_tests: [unique]
      - name: OrderID
        data_type: int64
        description: '{{ doc("order_id") }}'
        constraints:
          - type: not_null
      - name: CustomerKey
        data_type: int64
        description: '{{ doc("order_customer_key") }}'
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: CustomerKey
      - name: ProductName
        data_type: string
        description: '{{ doc("product_name") }}'
        constraints:
          - type: not_null
      - name: ProductCategory
        data_type: string
        description: '{{ doc("product_category") }}'
        constraints:
          - type: not_null
      - name: OrderDate
        data_type: date
        description: '{{ doc("order_date") }}'
        constraints:
          - type: not_null
      - name: Quantity
        data_type: int64
        description: '{{ doc("order_quantity") }}'
        constraints:
          - type: not_null
      - name: UnitPrice
        data_type: numeric
        description: '{{ doc("order_unit_price") }}'
        constraints:
          - type: not_null
      - name: Amount
        data_type: numeric
        description: '{{ doc("order_amount") }}'
        constraints:
          - type: not_null
      - name: SourceSystem
        data_type: string
        description: '{{ doc("source_system") }}'
        constraints:
          - type: not_null
      - name: InsertionTimestamp
        data_type: timestamp
        description: '{{ doc("insertion_timestamp") }}'
        constraints:
          - type: not_null
