<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410"
     width="1200" height="410" role="img"
     aria-label="How it is wired: seeded CSVs and the dbt build feed dbt_artifacts metadata and query-comment BigQuery job labels; both land in BigQuery's INFORMATION_SCHEMA.JOBS and dbtmeta_* tables, joined by dbt_invocation_id; the linked Power BI project reads that into its Query and Usage Insights and dbt Jobs and Nodes Failed report">
  <style>
    .rise { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    .flow { stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <rect width="1200" height="410" rx="12" fill="#0D1117"/>

  <g class="rise">
    <text x="40" y="38" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="20" font-weight="700" fill="#3B82F6" letter-spacing="-0.2">🔌 How it is wired</text>
  </g>

  <!-- flow lines, drawn under the boxes -->
  <g fill="none" stroke-width="2">
    <path class="flow" d="M340,110 C410,110 400,210 470,210" stroke="#8B5CF6"/>
    <path class="flow" d="M340,205 C410,205 440,210 470,210" stroke="#22D3EE"/>
    <path class="flow" d="M340,300 C410,300 400,210 470,210" stroke="#3B82F6"/>
    <path class="flow" d="M750,210 C810,210 820,210 880,210" stroke="#10B981"/>
  </g>

  <g class="rise" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

    <!-- column 1: sources -->
    <rect x="40" y="70" width="300" height="80" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="40" y="70" width="4" height="80" rx="2" fill="#8B5CF6"/>
    <text x="58" y="96" font-size="16" font-weight="700" fill="#E6EDF3">SEEDS / *.CSV</text>
    <text x="58" y="117" font-size="15" fill="#8B949E">system_a + system_b, fabricated</text>
    <text x="58" y="135" font-size="15" fill="#8B949E">customer + sales_order</text>

    <rect x="40" y="165" width="300" height="80" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="40" y="165" width="4" height="80" rx="2" fill="#22D3EE"/>
    <text x="58" y="191" font-size="16" font-weight="700" fill="#E6EDF3">DBT BUILD</text>
    <text x="58" y="212" font-size="15" fill="#8B949E">staging &#8594; warehouse &#8594; analytics</text>
    <text x="58" y="230" font-size="15" fill="#8B949E">contracts &#183; SCD2 &#183; custom materialization</text>

    <rect x="40" y="260" width="300" height="80" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="40" y="260" width="4" height="80" rx="2" fill="#3B82F6"/>
    <text x="58" y="286" font-size="16" font-weight="700" fill="#E6EDF3">DBT_ARTIFACTS + QUERY_COMMENT</text>
    <text x="58" y="307" font-size="15" fill="#8B949E">dbtmeta_* metadata, 34 objects</text>
    <text x="58" y="325" font-size="15" fill="#8B949E">BigQuery job labels, every query</text>

    <!-- column 2: BigQuery -->
    <rect x="470" y="125" width="280" height="170" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="470" y="125" width="4" height="170" rx="2" fill="#10B981"/>
    <text x="490" y="162" font-size="17" font-weight="700" fill="#E6EDF3">BIGQUERY</text>
    <text x="490" y="192" font-size="15" fill="#8B949E">INFORMATION_SCHEMA.JOBS</text>
    <text x="490" y="213" font-size="15" fill="#8B949E">dbtmeta_* tables</text>
    <text x="490" y="234" font-size="15" fill="#8B949E">joined by dbt_invocation_id</text>

    <!-- column 3: the Power BI project -->
    <rect x="880" y="125" width="280" height="170" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="880" y="125" width="4" height="170" rx="2" fill="#8B5CF6"/>
    <text x="900" y="162" font-size="17" font-weight="700" fill="#E6EDF3">POWER BI PROJECT</text>
    <text x="900" y="192" font-size="15" fill="#8B949E">Bigquery &amp; Dbt Cost Observability</text>
    <text x="900" y="213" font-size="15" fill="#8B949E">Query &amp; Usage Insights</text>
    <text x="900" y="234" font-size="15" fill="#8B949E">dbt Jobs &#183; Nodes Failed</text>

    <text x="40" y="370" font-size="15" fill="#8B949E">This repo produces the dbt run + BigQuery job history &#8212; the linked Power BI project turns it into the report.</text>
  </g>
</svg>
