version: 2

macros:
  - name: bigquery__get_merge_sql
    description: >
      Override of dbt's MERGE renderer, adding a
      `WHEN MATCHED AND (<tracked column differs>) THEN UPDATE` clause so that
      matched-but-unchanged rows are left untouched and keep their original
      insertion_timestamp. Opt-in per model via `meta.merge_update_when_changed: true`
      (a custom config key, so dbt 1.11 requires it under `meta`);
      without that config it delegates to `default__get_merge_sql`, so every other
      merge model in the project is unaffected. Needed because dbt-bigquery rejects
      custom `incremental_strategy` values, and because `incremental_predicates`
      cannot express this (they land in the ON clause, turning unchanged rows into
      INSERTs). This is SCD type 1 — use a snapshot if history is required.
      Mirrors `default__get_merge_sql`; re-check on adapter upgrade.
    arguments:
      - name: target
        type: relation
        description: The model's target relation (merge destination).
      - name: source
        type: string
        description: Subquery or temp relation supplying the new rows.
      - name: unique_key
        type: string | list
        description: >
          Column(s) forming the merge ON clause. Required when
          merge_update_when_changed is set — a compiler error is raised otherwise.
      - name: dest_columns
        type: list
        description: Column objects of the target relation, used for the INSERT list.
      - name: incremental_predicates
        type: list
        description: >
          Extra ON-clause predicates passed through from dbt. Not a place to put
          change-detection logic.

  - name: _merge_change_columns
    description: >
      Resolves the columns that decide whether a matched row changed. Explicit
      `merge_change_columns` wins and is validated against the model's columns so a
      typo fails at compile time; otherwise all destination columns except the
      unique_key and `merge_change_exclude_columns` (default
      ['insertion_timestamp'], which is CURRENT_TIMESTAMP() and would always
      differ). Name matching is case-insensitive.
    arguments:
      - name: unique_key
        type: string | list
        description: Merge key column(s), always excluded from comparison.
      - name: dest_columns
        type: list
        description: Column objects of the target relation.
